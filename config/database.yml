default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

test:
  <<: *default
  database: db/test.sqlite3

production:
  <<: *default
  # Local SQLite on the app's filesystem. The ratings table is rebuilt from the
  # IMDb datasets at deploy time (rake imdb:seed); air dates are a lazy OMDB
  # cache that re-warms after each deploy. Nothing here needs to survive a
  # deploy, so no external database is required.
  database: db/production.sqlite3
